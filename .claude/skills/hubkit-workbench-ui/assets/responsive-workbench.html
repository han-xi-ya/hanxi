<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#071318" media="(prefers-color-scheme: dark)">
  <title>Responsive Workbench</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f3f7f8;
      --page-accent: #e6f3f2;
      --surface: #fff;
      --surface-soft: #f7fafb;
      --surface-hover: #eef5f5;
      --border: #dce6e8;
      --border-strong: #c7d6d9;
      --text: #14252c;
      --muted: #667980;
      --subtle: #8a9aa0;
      --primary: #0f8b8d;
      --primary-hover: #0b7779;
      --primary-soft: rgba(15,139,141,.1);
      --info: #2563eb;
      --positive: #08875d;
      --warning: #b66f08;
      --danger: #d64545;
      --shadow-sm: 0 4px 14px rgba(32,66,72,.055);
      --shadow-panel: 0 18px 45px rgba(32,66,72,.085);
      --focus: 0 0 0 3px rgba(15,139,141,.22);
      --font: "Segoe UI Variable Text", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      --display: "Segoe UI Variable Display", "Segoe UI", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #071318; --page-accent: #0b2326; --surface: #0e1c22;
        --surface-soft: #12252c; --surface-hover: #173039; --border: #213840;
        --border-strong: #31505a; --text: #e8f2f3; --muted: #9aadb2;
        --subtle: #748a90; --primary: #42b7b4; --primary-hover: #59c8c5;
        --primary-soft: rgba(66,183,180,.13); --info: #72a5ff;
        --positive: #47c792; --warning: #f0ac45; --danger: #ff7974;
        --shadow-sm: 0 5px 18px rgba(0,0,0,.18);
        --shadow-panel: 0 22px 50px rgba(0,0,0,.23);
      }
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100dvh; margin: 0;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      overflow-x: hidden; color: var(--text);
      background: radial-gradient(circle at 8% -10%, var(--page-accent), transparent 30rem), var(--page);
      font: 14px/1.5 var(--font);
    }
    button, input, textarea { font: inherit; }
    svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .shell { width: 100%; max-width: 1120px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 16px; padding: 4px 2px 15px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .mark, .icon { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 40px; color: var(--primary); background: var(--primary-soft); border-radius: 12px; }
    .mark { color: #fff; background: linear-gradient(145deg, var(--primary), #176b94); }
    .brand strong, h2 { font-family: var(--display); }
    .brand strong { display: block; font-size: 18px; line-height: 1.2; }
    .brand small, .muted { color: var(--muted); font-size: 11px; }
    .top-actions, .badge, .panel-footer, .resource-meta { display: flex; align-items: center; gap: 9px; }
    .badge { min-height: 32px; padding: 5px 10px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 11px; font-weight: 650; }
    .dot { width: 7px; height: 7px; background: var(--positive); border-radius: 50%; box-shadow: 0 0 0 4px color-mix(in srgb, var(--positive) 12%, transparent); animation: breathe 1.8s ease-in-out infinite; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 8px 13px; color: var(--text); background: var(--surface-soft); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 680; }
    .button:hover { background: var(--surface-hover); border-color: var(--border-strong); transform: translateY(-1px); }
    .button:focus-visible, input:focus-visible, textarea:focus-visible, .dropzone:focus-within, .crumb:focus-visible { outline: none; box-shadow: var(--focus); }
    .button-primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .button-primary:hover { background: var(--primary-hover); }
    .stats { display: grid; grid-template-columns: 1.05fr repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .stat { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow-sm); }
    .stat:first-child { background: linear-gradient(135deg, var(--primary-soft), var(--surface) 72%); }
    .stat div { min-width: 0; }
    .label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .value { display: block; margin: 2px 0; overflow: hidden; font: 750 17px/1.3 var(--mono); font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
    .stat small { color: var(--subtle); font-size: 10px; }
    .tasks { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-bottom: 14px; }
    .panel { min-width: 0; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-panel); }
    .task { display: flex; min-height: 280px; flex-direction: column; }
    .heading { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 15px; }
    .heading p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .field { width: 100%; min-height: 122px; flex: 1; padding: 12px; resize: vertical; color: var(--text); background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; }
    .panel-footer { justify-content: space-between; margin-top: 11px; }
    .dropzone { display: grid; place-items: center; min-height: 132px; flex: 1; padding: 18px; cursor: pointer; text-align: center; background: var(--surface-soft); border: 1.5px dashed var(--border-strong); border-radius: 12px; }
    .dropzone:hover { color: var(--primary); background: var(--primary-soft); border-color: var(--primary); }
    .dropzone input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .progress { width: 100%; height: 7px; margin: 10px 0 4px; overflow: hidden; background: var(--border); border-radius: 999px; }
    .progress span { display: block; width: 64%; height: 100%; background: linear-gradient(90deg, var(--primary), #55c8c3); border-radius: inherit; }
    .workspace { padding: 18px; }
    .workspace-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .count { padding: 4px 9px; color: var(--muted); background: var(--surface-soft); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; }
    .breadcrumbs { display: flex; align-items: center; gap: 3px; margin: 14px 0 10px; padding: 6px; overflow-x: auto; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 10px; }
    .crumb { min-height: 30px; flex: 0 0 auto; padding: 4px 7px; color: var(--primary); background: none; border: 0; border-radius: 7px; cursor: pointer; font-size: 11px; font-weight: 680; }
    .resources { display: flex; flex-direction: column; gap: 5px; }
    .resource { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px; min-height: 54px; padding: 8px 9px; background: var(--surface-soft); border: 1px solid transparent; border-radius: 11px; }
    .resource:hover { background: var(--surface-hover); border-color: var(--border); }
    .resource-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .resource-copy { min-width: 0; }
    .resource-name { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .resource-description { color: var(--subtle); font-size: 10px; }
    .resource-meta { color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
    .state { display: grid; place-items: center; min-height: 130px; margin-top: 10px; padding: 20px; text-align: center; background: var(--surface-soft); border: 1px dashed var(--border); border-radius: 11px; }
    .state strong { font-size: 12px; }
    .state p { margin: 5px 0 12px; color: var(--muted); font-size: 11px; }
    footer { display: flex; justify-content: center; gap: 7px; padding-top: 18px; color: var(--subtle); font-size: 10px; }
    @keyframes breathe { 50% { opacity: .45; } }
    @media (max-width: 900px) { .stats { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 680px) { .tasks { grid-template-columns: 1fr; } .resource { grid-template-columns: 1fr; } .resource-meta { justify-content: space-between; padding-left: 50px; } .brand small { display: none; } }
    @media (max-width: 460px) { .badge { display: none; } .stats { grid-template-columns: 1fr; } .panel-footer { align-items: stretch; flex-direction: column; } .panel-footer .button { width: 100%; } .resource-meta { padding-left: 0; } }
    @media (pointer: coarse) { .button { min-height: 44px; } .crumb { min-height: 40px; } .resource { min-height: 62px; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span><span><strong>工具工作台</strong><small>简短描述当前工具的职责</small></span></div>
      <div class="top-actions"><span class="badge"><span class="dot" aria-hidden="true"></span>运行正常</span><button class="button" type="button">刷新状态</button></div>
    </header>

    <main>
      <section class="stats" aria-label="运行概览">
        <article class="stat"><span class="icon" aria-hidden="true">01</span><div><span class="label">整体状态</span><strong class="value">Healthy</strong><small>最近更新于 10:24</small></div></article>
        <article class="stat"><span class="icon" aria-hidden="true">02</span><div><span class="label">活动任务</span><strong class="value">12</strong><small>2 个正在处理</small></div></article>
        <article class="stat"><span class="icon" aria-hidden="true">03</span><div><span class="label">处理速率</span><strong class="value">84.2/s</strong><small>当前会话</small></div></article>
        <article class="stat"><span class="icon" aria-hidden="true">04</span><div><span class="label">累计完成</span><strong class="value">1,248</strong><small>本次运行</small></div></article>
      </section>

      <section class="tasks" aria-label="主要任务">
        <article class="panel task">
          <div class="heading"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4zM8 9h8M8 13h5"/></svg></span><div><h2>提交操作</h2><p>说明输入会产生什么结果。</p></div></div>
          <label for="task-input" class="muted">任务内容</label>
          <textarea id="task-input" class="field" placeholder="输入内容…"></textarea>
          <div class="panel-footer"><span class="muted">支持键盘快捷操作</span><button class="button button-primary" type="button">开始处理</button></div>
        </article>

        <article class="panel task">
          <div class="heading"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3zM12 17v-6M9 14l3-3 3 3"/></svg></span><div><h2>选择资源</h2><p>提供点击选择和拖放入口。</p></div></div>
          <label class="dropzone"><input type="file"><span><strong>选择一个资源</strong><br><span class="muted">也可以拖放到此区域</span></span></label>
          <div class="progress" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><span></span></div>
          <div class="panel-footer"><span class="muted">处理中 · 64%</span><button class="button" type="button">取消</button></div>
        </article>
      </section>

      <section class="panel workspace" aria-labelledby="resources-title">
        <div class="workspace-head"><div class="heading"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></span><div><h2 id="resources-title">资源列表</h2><p>展示当前范围内可管理的实体。</p></div></div><span class="count">3 项</span></div>
        <nav class="breadcrumbs" aria-label="当前层级"><button class="crumb" type="button">全部资源</button><span aria-hidden="true">/</span><button class="crumb" type="button">当前分组</button></nav>
        <div class="resources">
          <article class="resource"><div class="resource-main"><span class="icon" aria-hidden="true">A</span><div class="resource-copy"><div class="resource-name">具有较长名称的资源项目</div><div class="resource-description">次级说明和最近更新时间</div></div></div><div class="resource-meta"><span>READY</span><button class="button" type="button">查看</button></div></article>
          <article class="resource"><div class="resource-main"><span class="icon" aria-hidden="true">B</span><div class="resource-copy"><div class="resource-name">另一个资源</div><div class="resource-description">简短的状态上下文</div></div></div><div class="resource-meta"><span>12 ms</span><button class="button" type="button">查看</button></div></article>
        </div>
        <!-- Replace the resource list with one of these states when applicable. -->
        <div class="state"><strong>当前范围没有资源</strong><p>说明空状态原因，并提供明确的下一步。</p><button class="button" type="button">重新加载</button></div>
      </section>
    </main>
    <footer><span>环境或安全提示</span><span aria-hidden="true">·</span><span>保持信息简短</span></footer>
  </div>
</body>
</html>
