<!--
  一次性设计预览页（不属应用代码）：九套候选主题 + 现状青绿基线，浅/深并排。
  令牌选择器结构即落地方案：[data-theme=浅深] × [data-accent=色板] 双轴组合。
  设计规范见同目录 README.md；数据可经 gen-palettes.mjs 重新生成校验。
-->
<style>
/* ============ 结构常量（与主题无关） ============ */
:root {
  --font-text: "Segoe UI Variable Text", "Microsoft YaHei UI", "Segoe UI", sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --text-micro: 10px; --text-xs: 11px; --text-sm: 12px; --text-base: 13px;
  --text-md: 14px; --text-lg: 16px; --text-xl: 18px; --text-2xl: 22px;
  --radius-micro: 4px; --radius-control: 8px; --radius-element: 12px;
  --radius-panel: 16px; --radius-pill: 999px;
  --control-h-lg: 36px; --control-h-md: 30px; --control-h-sm: 24px;
  --motion-fast: 100ms; --motion-base: 150ms;
}

/* ============ 主题模式层：状态色/遮罩/阴影基座（跨色板恒定） ============ */
[data-theme="light"] {
  color-scheme: light;
  --state-positive: #08875d; --state-positive-soft: #e2f4ec;
  --state-information: #2563eb; --state-information-soft: #e7effd;
  --state-warning: #b66f08; --state-warning-soft: #fbf1de;

  --state-information-glow: rgba(37, 99, 235, 0.15);

  --state-danger-glow: rgba(214, 69, 69, 0.15);
  --overlay-mask: rgba(10, 24, 29, 0.46);
  --shadow-small: 0 4px 14px rgba(32, 66, 72, 0.055);
  --shadow-panel: 0 18px 45px rgba(32, 66, 72, 0.085);
}
[data-theme="dark"] {
  color-scheme: dark;
  --state-positive: #47c792; --state-positive-soft: #0f2e24;
  --state-information: #72a5ff; --state-information-soft: #16233c;
  --state-warning: #f0ac45; --state-warning-soft: #33260f;
  --state-danger: #ff7974; --state-danger-soft: #3a1a1a;

/* ============ 页面骨架 ============ */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-page); color: var(--color-text);
  font: var(--text-base)/1.55 var(--font-text);
}
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px;
  align-items: center; padding: 12px 24px;
  background: var(--surface-panel); border-bottom: 1px solid var(--color-border);
}
.topbar h1 { font: 600 var(--text-md)/1.3 var(--font-display); margin: 0 16px 0 0; }
.seg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--color-border); border-radius: var(--radius-pill); background: var(--surface-soft); }
.seg button {
  border: 0; border-radius: var(--radius-pill); padding: 4px 12px; cursor: pointer;
  background: transparent; color: var(--color-text-muted); font: 500 var(--text-sm) var(--font-text);
}
.seg button[aria-pressed="true"] { background: var(--color-primary); color: var(--color-on-primary); }
.grow { flex: 1; }
.hint { color: var(--color-text-subtle); font-size: var(--text-xs); }
main { max-width: 1280px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
.stage-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; }
.stage-label { display: flex; justify-content: space-between; margin: 0 4px 8px; color: var(--color-text-muted); font-size: var(--text-sm); }
.stage-label b { color: var(--color-text); font-weight: 600; }

/* ============ 迷你工作台 mock（消费 token 的示范面） ============ */
.mock {
  background: var(--surface-page); border: 1px solid var(--color-border);
  border-radius: var(--radius-panel); box-shadow: var(--shadow-panel);
  overflow: hidden; display: grid; grid-template-columns: 150px 1fr; min-height: 430px;
  font-size: var(--text-base);
}
.mock .rail { background: var(--surface-panel); border-right: 1px solid var(--color-border); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.rail .brand { display: flex; align-items: center; gap: 8px; font: 600 var(--text-md)/1 var(--font-display); padding: 6px 8px 16px; }
.rail .brand i { width: 14px; height: 14px; border-radius: var(--radius-micro); background: var(--color-primary); box-shadow: 0 0 0 4px var(--color-primary-glow); }
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--radius-control);
  color: var(--color-text-muted); font-size: var(--text-sm); cursor: default;
}
.nav-item:hover { background: var(--surface-hover); }
.nav-item.on { background: var(--surface-selected); color: var(--color-primary); font-weight: 600; box-shadow: inset 2px 0 0 var(--color-primary); }
.nav-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--state-positive); margin-left: auto; box-shadow: 0 0 6px var(--state-positive-glow); }
.mock .main { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.mhead { display: flex; align-items: center; gap: 10px; }
.mhead h3 { margin: 0; font: 600 var(--text-xl)/1.2 var(--font-display); letter-spacing: -0.01em; }
.mhead .sub { color: var(--color-text-subtle); font-size: var(--text-xs); }
.mhead .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: var(--control-h-md);
  padding: 0 14px; border-radius: var(--radius-control); border: 1px solid transparent;
  font: 600 var(--text-sm) var(--font-text); cursor: pointer;
}
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-plain { background: var(--surface-panel); color: var(--color-text); border-color: var(--color-border-strong); }
.btn-danger { background: var(--state-danger); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; box-shadow: 0 0 0 5px var(--focus-ring); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi {
  background: var(--surface-panel); border: 1px solid var(--color-border);
  border-radius: var(--radius-element); box-shadow: var(--shadow-small); padding: 10px 12px;
}
.kpi .num { font: 600 var(--text-2xl)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .cap { color: var(--color-text-muted); font-size: var(--text-xs); margin-top: 2px; }
.kpi.pos .num { color: var(--state-positive); } .kpi.warn .num { color: var(--state-warning); } .kpi.dgr .num { color: var(--state-danger); }
.tbl { background: var(--surface-panel); border: 1px solid var(--color-border); border-radius: var(--radius-element); overflow: hidden; }
.tbl .trow {
  display: grid; grid-template-columns: 1.4fr 1.6fr 90px; gap: 10px; align-items: center;
  padding: 8px 12px; border-top: 1px solid var(--color-border); font-size: var(--text-sm); min-height: 44px;
}
.tbl .trow:first-child { border-top: 0; background: var(--surface-soft); color: var(--color-text-muted); font-size: var(--text-xs); font-weight: 600; min-height: 0; padding: 6px 12px; }
.tbl .trow.sel { background: var(--surface-selected); }
.tbl .mono { font: var(--text-sm) var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 600; width: max-content;
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.pos { background: var(--state-positive-soft); color: var(--state-positive); }
.chip.inf { background: var(--state-information-soft); color: var(--state-information); }
.chip.wrn { background: var(--state-warning-soft); color: var(--state-warning); }
.chip.dgr { background: var(--state-danger-soft); color: var(--state-danger); }
.inputrow { display: flex; gap: 10px; align-items: center; }
.field {
  flex: 1; height: var(--control-h-md); padding: 0 10px; border-radius: var(--radius-control);
  border: 1px solid var(--color-border-strong); background: var(--surface-soft); color: var(--color-text);
  font: var(--text-sm) var(--font-text);
}
.field::placeholder { color: var(--color-text-subtle); }
.field.faked { border-color: var(--color-primary); box-shadow: 0 0 0 4px var(--focus-ring); }
.toggle { width: 36px; height: 20px; border-radius: var(--radius-pill); background: var(--color-primary); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.toast {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px;
  background: var(--surface-panel); border: 1px solid var(--color-border); border-left: 3px solid var(--color-primary);
  border-radius: var(--radius-control); box-shadow: var(--shadow-panel); font-size: var(--text-sm);
}
.toast .t-sub { color: var(--color-text-muted); font-size: var(--text-xs); }
.progress { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--surface-hover); overflow: hidden; }
.progress i { display: block; height: 100%; width: 64%; border-radius: inherit; background: var(--color-primary); box-shadow: 0 0 8px var(--color-primary-glow); }

/* ============ 色卡与对比度审计 ============ */
.audit {
  background: var(--surface-panel); border: 1px solid var(--color-border);
  border-radius: var(--radius-panel); box-shadow: var(--shadow-small); padding: 18px 20px; margin-top: 4px;
}
.audit h2 { margin: 0 0 4px; font: 600 var(--text-lg) var(--font-display); }
.audit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 14px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
.sw { border: 1px solid var(--color-border); border-radius: var(--radius-control); overflow: hidden; }
.sw i { display: block; height: 34px; }
.sw span { display: block; padding: 3px 7px; font: var(--text-micro) var(--font-mono); color: var(--color-text-muted); background: var(--surface-soft); }
table.cc { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
table.cc th { text-align: left; color: var(--color-text-muted); font-size: var(--text-xs); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--color-border); }
table.cc td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--color-border); vertical-align: top; }
table.cc td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: 600; margin-left: 8px; }
.badge.ok { background: var(--state-positive-soft); color: var(--state-positive); }
.badge.lg { background: var(--state-warning-soft); color: var(--state-warning); }
.badge.no { background: var(--state-danger-soft); color: var(--state-danger); }
.aa { color: var(--color-text-subtle); font-size: var(--text-xs); }
@media (max-width: 560px) {
  .mock { grid-template-columns: 1fr; }
  .mock .rail { display: none; }
  .audit-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="topbar">
  <h1>Hanxi 主题配色提案</h1>
  <div class="seg" id="paletteSeg"></div>
  <div class="grow"></div>
  <span class="hint">浅 / 深并排 = 同一色板双标定 · 数据由页面实时计算</span>
</header>
<main>
  <div class="stage-wrap">
    <section>
      <div class="stage-label"><b>浅色模式</b><span data-mode="light" class="hint"></span></div>
      <div id="stageLight" data-theme="light"></div>
      <div class="audit" data-audit="light"></div>
    </section>
    <section>
      <div class="stage-label"><b>深色模式</b><span data-mode="dark" class="hint"></span></div>
      <div id="stageDark" data-theme="dark"></div>
      <div class="audit" data-audit="dark"></div>
    </section>
  </div>
</main>
<script>
/* 迷你工作台模板（消费语义 token，演示真实界面各面） */
const MOCK = `
<div class="mock">
  <aside class="rail">
    <div class="brand"><i></i>Hanxi</div>
    <div class="nav-item">总览</div>
    <div class="nav-item on">FRPC <span class="dot"></span></div>
    <div class="nav-item">端口扫描</div>
    <div class="nav-item">文件共享</div>
    <div class="nav-item">系统</div>
  </aside>
  <div class="main">
    <div class="mhead">
      <div><h3>FRPC 隧道</h3><div class="sub">3 个代理 · 最近同步 12s 前</div></div>
      <div class="grow"></div>
      <button class="btn btn-primary">启动全部</button>
      <button class="btn btn-plain">配置</button>
    </div>
    <div class="kpis">
      <div class="kpi pos"><div class="num">2/3</div><div class="cap">在线隧道</div></div>
      <div class="kpi"><div class="num" style="color:var(--color-text)">1.4<small style="font-size:11px"> MB/s</small></div><div class="cap">实时流量</div></div>
      <div class="kpi dgr"><div class="num">1</div><div class="cap">失败重试</div></div>
    </div>
    <div class="tbl">
      <div class="trow"><span>名称</span><span>入口</span><span>状态</span></div>
      <div class="trow sel"><span>web-tunnel</span><span class="mono">7000 → rdp://10.0.4.2:3389</span><span class="chip pos">运行中</span></div>
      <div class="trow"><span>ssh-jump</span><span class="mono">2222 → tcp://10.0.4.2:22</span><span class="chip wrn">重试中</span></div>
      <div class="trow"><span>metrics</span><span class="mono">9090 → http://127.0.0.1:9090</span><span class="chip dgr">失败</span></div>
      <div class="trow"><span>dns-sync</span><span class="mono">5353 → udp://10.0.4.9:53</span><span class="chip inf">空闲</span></div>
    </div>
    <div class="inputrow">
      <input class="field faked" value="frps.addr = 10.0.4.9" readonly>
      <span class="toggle"></span>
      <button class="btn btn-danger">停止</button>
    </div>
    <div class="toast"><div style="flex:1"><div>隧道 web-tunnel 已重连</div><div class="t-sub">14:32:07 · 自动恢复</div></div><button class="btn btn-plain">知道了</button></div>
    <div class="inputrow"><span class="hint" style="font-size:var(--text-xs);color:var(--color-text-muted)">部署进度</span><span class="progress"><i></i></span></div>
  </div>
</div>`;

document.getElementById('stageLight').insertAdjacentHTML('beforeend', MOCK);
document.getElementById('stageDark').insertAdjacentHTML('beforeend', MOCK);

/* 色板切换：页面骨架 + 两个 mock 的 data-accent */
const PALETTES = [
  ['teal', '青壳·现状'], ['cobalt', '钴蓝'], ['graphite', '石墨'],
  ['moss', '苔原'], ['rust', '赭岩'], ['plum', '紫晶'], ['azure', '蔚蓝·macOS'],
  ['rose', '玫瑰'], ['ink', '玄墨'], ['onyx', '曜石·高对比'],
];
const seg = document.getElementById('paletteSeg');
for (const [key, zh] of PALETTES) {
  const b = document.createElement('button');
  b.textContent = zh; b.dataset.k = key;
  b.onclick = () => apply(key);
  seg.appendChild(b);
}
function apply(key) {
  document.documentElement.dataset.accent = key;
  for (const btn of seg.children) btn.setAttribute('aria-pressed', String(btn.dataset.k === key));
  for (const stage of document.querySelectorAll('[data-theme]')) stage.dataset.accent = key;
  document.querySelector('title').textContent = `Hanxi 主题配色提案 · ${PALETTES.find(p => p[0] === key)[1]}`;
  renderAudits(key);
}

/* ---- 对比度实时审计（从渲染后的元素解析 token） ---- */
const parse = s => {
  s = s.trim();
  if (s.startsWith('#')) { const n = s.slice(1); return [parseInt(n.slice(0,2),16),parseInt(n.slice(2,4),16),parseInt(n.slice(4,6),16),1]; }
  const m = s.match(/[\d.]+/g).map(Number); return m.length === 3 ? [...m, 1] : m;
};
const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
const over = (fg, bg) => { const a = fg[3]; return [0,1,2].map(i => fg[i]*a + bg[i]*(1-a)); };
const lum = c => 0.2126*lin(c[0]) + 0.7152*lin(c[1]) + 0.0722*lin(c[2]);
function ratio(fgStr, bgStr) {
  const bg = parse(bgStr); let fg = parse(fgStr);
  if (fg[3] < 1) fg = over(fg, bg);
  const [a, b] = [lum(fg), lum(bg)].sort((x, y) => y - x);
  return (a + 0.05) / (b + 0.05);
}
const TOKEN_LABELS = [
  ['--surface-page', '页面底'], ['--surface-panel', '面板'], ['--surface-soft', '软底'],
  ['--surface-hover', '悬浮'], ['--surface-selected', '选中行'], ['--color-border', '边框'],
  ['--color-border-strong', '强边框'], ['--color-text', '正文'], ['--color-text-muted', '辅助字'],
  ['--color-text-subtle', '弱注记'], ['--color-primary', '主色'],
];
const CHECKS = [
  ['正文/面板', '--color-text', '--surface-panel', 4.5],
  ['辅助字/面板', '--color-text-muted', '--surface-panel', 4.5],
  ['弱注记/面板', '--color-text-subtle', '--surface-panel', 3],
  ['主按钮字/主色', '--color-on-primary', '--color-primary', 4.5],
  ['主色链接/面板', '--color-primary', '--surface-panel', 4.5],
  ['正文/选中行', '--color-text', '--surface-selected', 4.5],
  ['成功字/成功底', '--state-positive', '--state-positive-soft', 4.5],
  ['警告字/警告底', '--state-warning', '--state-warning-soft', 4.5],
  ['危险字/危险底', '--state-danger', '--state-danger-soft', 4.5],
  ['信息字/信息底', '--state-information', '--state-information-soft', 4.5],
];
function renderAudits(key) {
  const zh = PALETTES.find(p => p[0] === key)[1];
  for (const mode of ['light', 'dark']) {
    const host = document.querySelector(`.audit[data-audit="${mode}"]`);
    const probe = document.querySelector(`.mock[data-theme="${mode}"]`);
    const cs = getComputedStyle(probe);
    const gv = t => cs.getPropertyValue(t);
    document.querySelector(`[data-mode="${mode}"]`).textContent = `${zh} · ${mode === 'light' ? '浅' : '深'}`;
    const sw = TOKEN_LABELS.map(([t, label]) => {
      const v = gv(t);
      return `<div class="sw"><i style="background:${v}"></i><span>${label}<br>${v.trim()}</span></div>`;
    }).join('');
    const rows = CHECKS.map(([label, f, b, need]) => {
      const r = ratio(gv(f), gv(b));
      const cls = r >= need ? 'ok' : r >= 3 ? 'lg' : 'no';
      const txt = r >= need ? 'AA' : r >= 3 ? 'AA大字' : '低';
      return `<tr><td>${label}</td><td>${Math.round(r * 100) / 100}:1</td><td><span class="badge ${cls}">${txt}</span></td></tr>`;
    }).join('');
    host.innerHTML = `
      <h2>${zh} · ${mode === 'light' ? '浅色' : '深色'}审计</h2>
      <div class="aa">阈值：正文 ≥4.5，大字/图形 ≥3，主按钮字 ≥4.5（基线青壳为 4.12，本次全部补足）</div>
      <div class="audit-grid">
        <div><div class="aa" style="margin-bottom:6px">色值面板</div><div class="swatches">${sw}</div></div>
        <div><div class="aa" style="margin-bottom:6px">对比度（渲染值实时计算）</div>
          <table class="cc"><thead><tr><th>配对</th><th>比值</th><th></th></tr></thead><tbody>${rows}</tbody></table>
        </div>
      </div>`;
  }
}
apply('cobalt');
</script>
</body>
</html>
