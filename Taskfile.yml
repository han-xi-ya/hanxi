version: '3'

vars:
  APP_NAME: "hanxi"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  generate:
    summary: Regenerates dependency metadata and frontend bindings
    cmds:
      - task: common:go:mod:tidy
      - task: common:generate:bindings

  verify:tidy:
    summary: Verifies go.mod and go.sum are tidy
    cmds:
      - task: common:go:mod:tidy
      - git diff --exit-code -- go.mod go.sum

  verify:bindings:
    summary: Verifies committed Wails bindings are current
    cmds:
      - task: common:generate:bindings
      - git diff --exit-code -- frontend/bindings

  check:
    summary: Runs repository quality checks
    cmds:
      - powershell -NoProfile -Command "if ((gofmt -l cmd internal embedassets.go | Measure-Object).Count -gt 0) { gofmt -l cmd internal embedassets.go; throw '发现未 gofmt 的 Go 文件' }"
      - go vet ./...
      - go test -count=1 ./...
      - task: common:frontend:run
        vars:
          SCRIPT: typecheck
      - task: common:frontend:run
        vars:
          SCRIPT: build
      - task: verify:tidy
      - task: verify:bindings

