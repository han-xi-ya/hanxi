version: '3'

# Build source of truth: keep product identity here.
info:
  companyName: "HubKit"
  productName: "HubKit"
  productIdentifier: "com.hubkit.app"
  description: "frpc 内网穿透开发工具箱：多实例联调、局域网扫描、端口查杀"
  copyright: "(c) 2026, HubKit"
  comments: "frpc 内网穿透开发工具箱"
  version: "0.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
fileAssociations: []
