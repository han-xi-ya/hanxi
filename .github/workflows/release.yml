name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（如 v0.1.0）'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails v3 CLI & go-task
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          cd frontend
          npm ci

      - name: Build Production Binaries
        shell: pwsh
        run: |
          task build
          Get-Item bin/hubkit.exe | Select-Object Name, Length

      - name: Package Portable ZIP & Compute Checksum
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $ver) { $ver = "v0.1.0" }

          # 创建便携包发布目录并附带 便携标志 data 目录
          New-Item -ItemType Directory -Force release/hubkit-portable/data | Out-Null
          Copy-Item bin/hubkit.exe release/hubkit-portable/hubkit.exe
          Copy-Item README.md release/hubkit-portable/README.md

          # 打包便携版 ZIP
          $zipName = "hubkit-windows-amd64-portable-$ver.zip"
          Compress-Archive -Path release/hubkit-portable/* -DestinationPath "release/$zipName" -Force

          # 单独准备独立 exe
          Copy-Item bin/hubkit.exe "release/hubkit-windows-amd64-$ver.exe"

          # 生成 SHA256 校验和清单
          cd release
          Get-FileHash -Algorithm SHA256 "hubkit-windows-amd64-$ver.exe", "$zipName" | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 "checksums.txt"

          Get-Content "checksums.txt"

      - name: Generate Changelog & Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
          @"
          ## 🚀 HubKit $ver 发布说明

          HubKit 是一款专为全栈与后端开发者打造的**极轻量现代桌面网络工具箱**（Go + Wails v3 + Vue 3）。

          ### 📦 资产下载与说明
          - **`hubkit-windows-amd64-portable-$ver.zip`**：**【推荐】绿色便携免安装版**（内置 `data/` 目录，配置/日志/版本均自包含在同级，解压即用）。
          - **`hubkit-windows-amd64-$ver.exe`**：单独立可执行文件（默认数据落盘在 `%APPDATA%/HubKit/`）。
          - **`checksums.txt`**：SHA256 完整性哈希校验清单。

          ### 🌟 核心特性
          - ⚡ **frpc 旗舰多实例穿透**：支持 TCP/UDP/HTTP/HTTPS/STCP/XTCP，**STCP/XTCP 访客端 (Visitor)** 深度支持，KCP/QUIC/WSS 底层协议，Host 重写与 Proxy Protocol v2。
          - 📝 **表单 ⇋ TOML 双向实时编辑**：支持可视化表单与原始 TOML 源码无损互转与实时语法校验。
          - 📦 **版本管理合并**：内置官方 GitHub / 镜像源一键拉取、SHA256 校验与本地导入。
          - 🔒 **硬件级安全 (DPAPI)**：敏感 Token 硬件加密存储，停机即时擦除临时配置文件。
          - 🛡️ **进程隔离 (JobObject)**：操作系统内核级进程树绑定，彻底告别孤儿进程与端口占用。
          - 🧰 **全能开发者套件**：微信机器人助手、Nmap 端口指纹扫描、端口占用精准 UAC 释放、局域网设备发现与网络诊断。
          "@ | Out-File -Encoding utf8 release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: HubKit ${{ github.ref_name || github.event.inputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/hubkit-windows-amd64-*.exe
            release/hubkit-windows-amd64-portable-*.zip
            release/checksums.txt
