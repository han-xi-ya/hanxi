name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（如 v0.3.0）'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails v3 CLI & go-task
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          cd frontend
          npm ci

      - name: Build Production Binaries
        shell: pwsh
        run: |
          task build
          Get-Item bin/hanxi.exe | Select-Object Name, Length

      - name: Package Portable ZIP & Compute Checksum
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $ver) { $ver = "v0.3.0" }

          # 创建便携包发布目录并附带 便携标志 data 目录
          New-Item -ItemType Directory -Force release/hanxi-portable/data | Out-Null
          Copy-Item bin/hanxi.exe release/hanxi-portable/hanxi.exe
          Copy-Item README.md release/hanxi-portable/README.md

          # 打包便携版 ZIP
          $zipName = "hanxi-windows-amd64-portable-$ver.zip"
          Compress-Archive -Path release/hanxi-portable/* -DestinationPath "release/$zipName" -Force

          # 单独准备独立 exe
          Copy-Item bin/hanxi.exe "release/hanxi-windows-amd64-$ver.exe"

          # 生成 SHA256 校验和清单
          cd release
          Get-FileHash -Algorithm SHA256 "hanxi-windows-amd64-$ver.exe", "$zipName" | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 "checksums.txt"

          Get-Content "checksums.txt"

      - name: Generate Changelog & Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
          @"
          ## 🚀 Hanxi $ver 发布说明

          Hanxi 是一个面向 Windows 的**开源工具工作台**（Go + Wails v3 + Vue 3），集中安装、管理与运行常用开源软件。

          > **品牌断代说明**：v0.3.0 使用全新的应用标识与 `%APPDATA%/Hanxi/` 数据目录，不读取旧版数据或自启配置。

          ### 📦 资产下载与说明
          - **`hanxi-windows-amd64-portable-$ver.zip`**：**【推荐】绿色便携免安装版**（内置 `data/` 目录，配置/日志/版本均自包含在同级，解压即用）。
          - **`hanxi-windows-amd64-$ver.exe`**：单独立可执行文件（默认数据落盘在 `%APPDATA%/Hanxi/`）。
          - **`checksums.txt`**：SHA256 完整性哈希校验清单。

          ### 🌟 集成工具
          - **开源软件统一入口**：集中查看、启用、安装和运行已集成工具。
          - **frpc 穿透管理**：管理 frp 项目、多实例进程、本地版本与运行状态。
          - **桌面与 CLI 工具托管**：集成 NanaZip、Everything、Snipaste、CCSwitch 等常用开源软件。
          - **系统与网络工具**：提供环境检测、端口管理、局域网发现、IP 诊断等能力。
          - **安全进程管理**：通过 DPAPI、JobObject 和完整性校验保护凭据与托管进程。
          "@ | Out-File -Encoding utf8 release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Hanxi ${{ github.ref_name || github.event.inputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/hanxi-windows-amd64-*.exe
            release/hanxi-windows-amd64-portable-*.zip
            release/checksums.txt
