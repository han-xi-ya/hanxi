name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    name: Lint, Test & Build Check
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails v3 CLI & go-task
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          cd frontend
          npm ci

      - name: Frontend Type Check & Build
        shell: pwsh
        run: |
          cd frontend
          npm run build

      - name: Go Test
        shell: pwsh
        run: |
          go test -v -race ./...

      - name: Production Binary Build Verification
        shell: pwsh
        run: |
          task build
