<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#071318" media="(prefers-color-scheme: dark)">
  <title>HubKit 快传</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="HubKit 快传首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 7h10M14 4l3 3-3 3M17 17H7M10 14l-3 3 3 3"/></svg>
        </span>
        <span>
          <strong>HubKit 快传</strong>
          <small>局域网文件与文本工作台</small>
        </span>
      </a>
      <div class="topbar-actions">
        <span id="connectionBadge" class="connection-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connectionText">局域网直连</span>
        </span>
        <button id="refreshButton" class="button button-secondary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
          刷新文件
        </button>
      </div>
    </header>

    <main>
      <section id="statsRegion" class="stats-grid" aria-label="实时传输概览">
        <article class="stat-card stat-card-primary">
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
          <div><span class="stat-label">活跃连接</span><strong id="statConn" class="stat-value">0</strong><small id="statsStatus">实时在线</small></div>
        </article>
        <article class="stat-card">
          <span class="stat-icon stat-icon-cyan" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg>
          </span>
          <div><span class="stat-label">当前速率</span><strong class="stat-value stat-pair"><span id="statUpRate" class="upload-color">↑ 0 B/s</span><span id="statDownRate" class="download-color">↓ 0 B/s</span></strong><small>上传 / 下载</small></div>
        </article>
        <article class="stat-card">
          <span class="stat-icon stat-icon-blue" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 4 7-8M16 8h4v4"/></svg>
          </span>
          <div><span class="stat-label">累计流量</span><strong class="stat-value stat-pair"><span id="statUpBytes" class="upload-color">↑ 0 B</span><span id="statDownBytes" class="download-color">↓ 0 B</span></strong><small>本次服务会话</small></div>
        </article>
        <article class="stat-card">
          <span class="stat-icon stat-icon-violet" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM8 3h8v4M8 12h8"/></svg>
          </span>
          <div><span class="stat-label">完成文件</span><strong id="statCounts" class="stat-value">0 / 0</strong><small>上传 / 下载</small></div>
        </article>
      </section>

      <section id="actionsGrid" class="actions-grid" aria-label="快捷传输操作">
        <article id="textDropCard" class="panel action-panel">
          <div class="panel-heading">
            <span class="panel-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4zM8 9h8M8 13h5"/></svg></span>
            <div><h2>投递文本或链接</h2><p>发送到电脑端投递箱，可粘贴命令、网址和代码片段。</p></div>
          </div>
          <label class="sr-only" for="dropContent">要发送的文本或链接</label>
          <textarea id="dropContent" class="textarea" placeholder="输入或粘贴内容…"></textarea>
          <div class="panel-footer">
            <span class="shortcut-hint"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd></span>
            <button id="dropSubmitButton" class="button button-primary" type="button">发送到电脑</button>
          </div>
        </article>

        <article id="uploadCard" class="panel action-panel">
          <div class="panel-heading">
            <span class="panel-icon panel-icon-upload" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span>
            <div><h2>上传到当前目录</h2><p id="uploadTarget">目标：根目录</p></div>
          </div>
          <label id="dropzone" class="dropzone" for="fileInput">
            <input id="fileInput" class="visually-hidden-input" type="file" multiple>
            <span class="dropzone-visual" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3zM12 17v-6M9 14l3-3 3 3"/></svg></span>
            <strong>选择文件上传</strong>
            <span>桌面端也可以拖放文件到这里</span>
          </label>
          <div id="uploadTask" class="upload-task hidden" aria-live="polite">
            <div class="upload-task-heading"><strong id="uploadFileName">准备上传</strong><span id="uploadPercent">0%</span></div>
            <div id="uploadProgress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="uploadProgressFill"></span></div>
            <div class="upload-task-meta"><span id="uploadStatus">等待开始</span><span id="uploadSummary"></span></div>
          </div>
          <div class="panel-footer upload-footer">
            <span id="uploadLimit" class="helper-text">支持批量与超大文件流式上传</span>
            <button id="cancelUploadButton" class="button button-danger hidden" type="button">取消上传</button>
          </div>
        </article>
      </section>

      <section class="panel browser-panel" aria-labelledby="browserTitle">
        <div class="browser-heading">
          <div class="panel-heading compact-heading">
            <span class="panel-icon panel-icon-folder" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg></span>
            <div><h2 id="browserTitle">共享文件</h2><p>点击文件预览，或直接下载到当前设备。</p></div>
          </div>
          <span id="itemCount" class="count-badge">加载中</span>
        </div>
        <nav id="breadcrumb" class="breadcrumb" aria-label="当前目录"></nav>
        <div id="fileList" class="file-list" aria-live="polite">
          <div class="state-message"><span class="spinner" aria-hidden="true"></span><strong>正在加载文件</strong></div>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <span>设备需连接同一局域网</span>
      <span aria-hidden="true">·</span>
      <span>传输内容仅在本地网络中流转</span>
    </footer>
  </div>
</body>
</html>
